name: Site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  # After a release scripts/release.sh runs this on main (gh workflow run --ref main):
  # GitHub Pages environment rules reject runs triggered by a tag.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Release list for the Download button
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=20" > docs/releases.json
      # Mirror of the latest DMG on the site itself: github.com is unreachable for some people
      # (VPNs, proxies, blocks) while the site loads. Updates download the DMG from here;
      # the Sparkle signature guarantees it's authentic.
      - name: Mirror the latest DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r '[.[] | select(.draft|not) | select(.prerelease|not)][0].tag_name // ""' docs/releases.json)
          if [ -n "$tag" ]; then
            mkdir -p docs/dl
            gh release download "$tag" -R "${{ github.repository }}" -p "*.dmg" -D docs/dl --clobber
            ls -la docs/dl
          fi
      - name: Put the version into the HTML (in case the JSON fails to load)
        run: |
          v=$(jq -r '[.[] | select(.draft|not) | select(.prerelease|not)][0].tag_name // "" | ltrimstr("v")' docs/releases.json)
          [ -n "$v" ] && sed -i "s|<span class=\"m-ver\">—</span>|<span class=\"m-ver\">v$v</span>|" docs/index.html || true
      - name: Bust image caches on every deploy
        run: sed -i -E "s/\.png\"/.png?v=${GITHUB_SHA::7}\"/g" docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
