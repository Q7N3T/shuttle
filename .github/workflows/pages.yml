name: Сайт

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  # После релиза сайт обновляет scripts/release.sh (gh workflow run --ref main):
  # запуск от тега GitHub Pages отклоняет правилами окружения.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Список релизов для кнопки «Скачать»
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=20" > docs/releases.json
      # Копия свежего DMG на самом сайте: github.com открывается не у всех (VPN, прокси, блокировки),
      # а сайт — открывается. Обновления берут DMG отсюда; подлинность проверяет подпись Sparkle.
      - name: Копия последнего DMG на сайте
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r '[.[] | select(.draft|not) | select(.prerelease|not)][0].tag_name // ""' docs/releases.json)
          if [ -n "$tag" ]; then
            mkdir -p docs/dl
            gh release download "$tag" -R "${{ github.repository }}" -p "*.dmg" -D docs/dl --clobber
            ls -la docs/dl
          fi
      - name: Версия прямо в HTML (на случай, если JSON не дойдёт)
        run: |
          v=$(jq -r '[.[] | select(.draft|not) | select(.prerelease|not)][0].tag_name // "" | ltrimstr("v")' docs/releases.json)
          [ -n "$v" ] && sed -i "s|<span class=\"m-ver\">—</span>|<span class=\"m-ver\">v$v</span>|" docs/index.html || true
      - name: Свежие картинки после каждого обновления
        run: sed -i -E "s/\.png\"/.png?v=${GITHUB_SHA::7}\"/g" docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
