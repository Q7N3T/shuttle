name: Wirrow
options:
  bundleIdPrefix: com.vadimgrekov
  developmentLanguage: ru
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Wirrow:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Localized
    scheme:
      testTargets: [WirrowTests]
    dependencies:
      - package: Sparkle
    preBuildScripts:
      - name: Build libmtp
        script: "\"$SRCROOT/scripts/build-deps.sh\""
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wirrow
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        NSPhotoLibraryAddUsageDescription: Wirrow добавляет фото и видео с телефона или Switch в «Фото».
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "0.6.2"
        CFBundleVersion: "14"
        ATSApplicationFontsPath: Fonts
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        # Automatic updates (Sparkle): the version list lives in the repository.
        SUFeedURL: https://raw.githubusercontent.com/Q7N3T/wirrow/main/appcast.xml
        SUPublicEDKey: OQkMHjKc/6xCJsLy7qUifmQ41D+OVyLJf1hB25fUHuE=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vadimgrekov.shuttle
        DEVELOPMENT_LANGUAGE: ru
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Wirrow-Bridging-Header.h
        # libmtp and libusb are built statically by scripts/build-deps.sh —
        # the app doesn't need Homebrew on the user's Mac.
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/deps/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/deps/lib
        OTHER_LDFLAGS: -lmtp -lusb-1.0 -liconv -lobjc -framework IOKit -framework CoreFoundation -framework Security
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        # A stable signature: macOS remembers granted permissions
        # (access to Downloads, etc.) by certificate, not by build hash.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: HDYY45A296
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Debug:
          # Tests load the test bundle into the app — so Debug has no Hardened Runtime.
          ENABLE_HARDENED_RUNTIME: NO

  WirrowTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Wirrow
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vadimgrekov.shuttle.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wirrow.app/Contents/MacOS/Wirrow
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: HDYY45A296
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Wirrow-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/deps/include
