name: Shuttle
options:
  bundleIdPrefix: com.vadimgrekov
  developmentLanguage: ru
  deploymentTarget:
    macOS: "14.0"
targets:
  Shuttle:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/ru.lproj
    preBuildScripts:
      - name: Build libmtp
        script: "\"$SRCROOT/scripts/build-deps.sh\""
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Shuttle
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        ATSApplicationFontsPath: Fonts
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vadimgrekov.shuttle
        DEVELOPMENT_LANGUAGE: ru
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shuttle-Bridging-Header.h
        # libmtp и libusb собраны статически скриптом scripts/build-deps.sh —
        # приложению не нужен Homebrew у пользователя.
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/deps/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/deps/lib
        OTHER_LDFLAGS: -lmtp -lusb-1.0 -liconv -lobjc -framework IOKit -framework CoreFoundation -framework Security
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Постоянная подпись: macOS запоминает выданные разрешения
        # (доступ к «Загрузкам» и т.д.) по сертификату, а не по хешу сборки.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: HDYY45A296
        MACOSX_DEPLOYMENT_TARGET: "14.0"
